<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
:root{
--bg:#f3f7fd;--panel:#ffffff;--ink:#12234a;--mute:#667085;--line:#dbe5f3;--brand:#0057c2;--brand-ink:#ffffff;--accent:#0a7bff;--open:#b45309;--open-bg:#fef3c7;--prog:#0057c2;--prog-bg:#e3efff;--ok:#15803d;--ok-bg:#dcfce7;--bad:#b91c1c;--bad-bg:#fee2e2;--shadow:0 1px 3px rgba(16,24,40,.08)}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 "Segoe UI",system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{margin:0;font-weight:600}h1{font-size:20px}h2{font-size:16px}h3{font-size:14px}
.mute{color:var(--mute)}.small{font-size:12px}
.btn{border:1px solid var(--line);background:var(--panel);padding:7px 13px;border-radius:6px;cursor:pointer}
.btn:hover{border-color:var(--brand)}.btn:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,.row:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.btn.p{background:var(--brand);color:var(--brand-ink);border-color:var(--brand)}.btn.bad{color:var(--bad);border-color:var(--bad)}.btn.ok{background:var(--ok);color:#fff;border-color:var(--ok)}
label{display:block;font-weight:500;margin:12px 0 4px}
input,select,textarea{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:6px;background:var(--panel)}
.err{color:var(--bad);min-height:20px;margin-top:8px}
/* login */
.login{min-height:calc(100vh - 20px);display:grid;grid-template-columns:1.1fr 1fr}
.side{background:linear-gradient(160deg,#0a7bff 0%,#0057c2 55%,#002a8f 100%);color:#fff;border-right:0;padding:48px;display:flex;flex-direction:column;justify-content:space-between}
.side h1{font-size:30px;line-height:1.2;max-width:14em}.side p{max-width:26em;color:#dbe9ff}.side .brand{color:#fff}.side .mute{color:#b9d4ff}.side img{width:120px;height:120px;background:#fff;border-radius:50%;padding:4px;box-shadow:0 4px 18px rgba(0,20,80,.35)}
.formwrap{display:grid;place-items:center;padding:24px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow)}
.lcard{width:100%;max-width:380px;padding:28px}
.demo{margin-top:18px;padding-top:14px;border-top:1px dashed var(--line)}
.demo .btn{margin:6px 6px 0 0;font-size:12px;padding:4px 9px}
/* app */
.top{display:flex;align-items:center;gap:14px;padding:10px 24px;background:var(--panel);border-bottom:3px solid var(--brand)}
.top .sp{flex:1}.brand{font-weight:600;color:var(--brand);display:flex;align-items:center;gap:10px}.brand img{width:34px;height:34px}
.tabs{display:flex;gap:4px;padding:0 24px;background:var(--panel);border-bottom:1px solid var(--line);overflow-x:auto}
.tab{padding:10px 14px;border:0;background:none;cursor:pointer;border-bottom:2px solid transparent;color:var(--mute);white-space:nowrap}
.tab.on{color:var(--brand);border-color:var(--brand);font-weight:600}
main{padding:24px;max-width:1100px;margin:0 auto}
.head{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:16px}.head .sp{flex:1}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:16px}
.stat{padding:14px 16px;cursor:pointer}.stat b{display:block;font-size:24px;font-weight:600}
.stat.on{border-color:var(--brand);box-shadow:inset 3px 0 0 var(--brand)}
.tools{display:flex;gap:10px;margin-bottom:12px;flex-wrap:wrap}.tools input{max-width:260px}.tools select{max-width:220px}
.tw{overflow-x:auto}table{width:100%;border-collapse:collapse;min-width:640px}
th,td{text-align:left;padding:10px 14px;border-bottom:1px solid var(--line)}th{font-weight:500;color:var(--mute);font-size:12px}
tr.row{cursor:pointer}tr.row:hover td{background:var(--bg)}tr:last-child td{border-bottom:0}
.pill{display:inline-block;padding:2px 9px;border-radius:99px;font-size:12px;font-weight:500}
.Open{background:var(--open-bg);color:var(--open)}.InProgress{background:var(--prog-bg);color:var(--prog)}.Approved,.Active{background:var(--ok-bg);color:var(--ok)}.Rejected,.Inactive{background:var(--bad-bg);color:var(--bad)}
.empty{padding:36px;text-align:center;color:var(--mute)}
.grid2{display:grid;grid-template-columns:1.6fr 1fr;gap:16px}.pad{padding:18px}
.kv{display:grid;grid-template-columns:130px 1fr;gap:6px 10px;margin:12px 0}.kv span:nth-child(odd){color:var(--mute)}
.log{list-style:none;padding:0;margin:10px 0 0}.log li{padding:8px 0 8px 14px;border-left:2px solid var(--line);position:relative}
.log li:before{content:"";position:absolute;left:-5px;top:14px;width:8px;height:8px;border-radius:50%;background:var(--accent)}
.menu{position:relative;display:inline-block}.mlist{position:absolute;right:0;top:100%;z-index:5;min-width:190px;background:var(--panel);border:1px solid var(--line);border-radius:8px;box-shadow:0 6px 20px rgba(16,24,40,.14);padding:4px}
.mlist button{display:block;width:100%;text-align:left;border:0;background:none;padding:7px 10px;cursor:pointer;border-radius:5px}.mlist button:hover{background:var(--bg)}
.modal{position:fixed;inset:0;background:rgba(16,24,40,.4);display:grid;place-items:center;padding:16px;z-index:20}
.modal .card{width:100%;max-width:440px;padding:22px;max-height:90vh;overflow:auto}
.acts{display:flex;gap:8px;justify-content:flex-end;margin-top:16px;flex-wrap:wrap}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:#1f2937;color:#fff;padding:10px 16px;border-radius:8px;max-width:90vw;z-index:30;box-shadow:0 6px 20px rgba(0,0,0,.3)}
.mail{font-family:ui-monospace,Menlo,monospace;background:var(--bg);border:1px dashed var(--line);border-radius:6px;padding:10px;margin-top:10px;font-size:12px;white-space:pre-wrap}
.chk{display:flex;gap:8px;align-items:center;margin:4px 0;font-weight:400}.chk input{width:auto}
@media(max-width:760px){.login{grid-template-columns:1fr}.side{padding:24px}.stats{grid-template-columns:1fr 1fr}.grid2{grid-template-columns:1fr}main{padding:16px}.top,.tabs{padding-left:16px;padding-right:16px}}
</style>
</head>

function loginV(){return shell(`<div class="card lcard"><h2>Sign in</h2><p class="mute small">Use the credentials emailed to you.</p>
<label for="em">Email</label><input id="em" type="email" autocomplete="username">
<label for="pw">Password</label><input id="pw" type="password" autocomplete="current-password" onkeydown="if(event.key==='Enter')doLogin()">
<div class="err" id="err"></div>
<button class="btn p" style="width:100%" onclick="doLogin()">Sign in</button>
<p style="text-align:center;margin:12px 0 0"><a href="#" onclick="go('forgot');return false">Forgot password?</a></p>
<div class="demo small mute">Sample logins<br><button class="btn" onclick="fill('admin@sandbox.local','Admin@123')">Super Admin</button><button class="btn" onclick="fill('anita@cdac.in','Temp@1234')">Support member</button><button class="btn" onclick="fill('ravi@cdac.in','Ravi@5678')">New member (must change password)</button></div></div>`)}
function forgotV(){return shell(`<div class="card lcard"><h2>Reset password</h2><p class="mute small">Enter your registered email. We will send a reset link that expires in 30 minutes.</p>
<label for="fe">Email</label><input id="fe" type="email"><div class="err" id="err"></div>
<button class="btn p" style="width:100%" onclick="doForgot()">Send reset link</button>
<p style="text-align:center;margin:12px 0 0"><a href="#" onclick="go('login');return false">Back to sign in</a></p></div>`)}
function changeV(){return shell(`<div class="card lcard"><h2>Set a new password</h2><p class="mute small">${S.user.must?'You signed in with a temporary password. Choose your own to continue.':'Choose a new password.'}</p>
<label for="p1">New password</label><input id="p1" type="password"><label for="p2">Confirm password</label><input id="p2" type="password"><div class="err" id="err"></div>
<div class="small mute">At least 8 characters with a letter and a number.</div>
<div class="acts"><button class="btn p" onclick="doChange()">Save password</button>${S.user.must?'':'<button class="btn" onclick="go(\'app\')">Cancel</button>'}</div></div>`)}
function go(v){S.view=v;render()}
function fill(e,p){$('#em').value=e;$('#pw').value=p}
function doLogin(){
 const e=$('#em').value.trim().toLowerCase(),p=$('#pw').value;
 if(e==='admin@sandbox.local'&&p==='Admin@123'){S.user={name:'Super Admin',admin:true,cats:[]};S.tab='tickets';return go('app')}
 const m=S.members.find(x=>x.email===e&&x.pw===p);
 if(!m){$('#err').textContent='Email or password is incorrect.';return}
 if(!m.active){$('#err').textContent='This account is deactivated. Contact the Super Admin.';return}
 m.last=now();S.user=m;S.tab='tickets';go(m.must?'change':'app')}
function doForgot(){const m=S.members.find(x=>x.email===$('#fe').value.trim().toLowerCase());if(!m){$('#err').textContent='No support account found for this email.';return}toast('Reset link sent to '+m.email);go('login')}
function doChange(){
 const a=$('#p1').value,b=$('#p2').value;
 if(a.length<8||!/[A-Za-z]/.test(a)||!/\d/.test(a)){$('#err').textContent='Password must be 8+ characters with a letter and a number.';return}
 if(a!==b){$('#err').textContent='Passwords do not match.';return}
 S.user.pw=a;S.user.must=false;toast('Password updated');go('app')}
function logout(){S.user=null;S.sel=null;S.menu=null;S.modal=null;go('login')}

 ${isAdmin()?'':'<button class="btn" onclick="go(\'change\')">Change password</button>'}<button class="btn" onclick="logout()">Log out</button></div>
 <div class="tabs">${tabs.map(t=>`<button class="tab ${S.tab===t[0]?'on':''}" onclick="S.tab='${t[0]}';S.sel=null;render()">${t[1]}</button>`).join('')}</div>
 <main>${S.tab==='tickets'?(S.sel?detailV():listV()):S.tab==='team'?teamV():catsV()}</main>`}

function listV(){
 const all=myTickets(),cnt=s=>all.filter(t=>t.st===s).length;
 let rows=all.filter(t=>(S.fstat==='All'||t.st===S.fstat)&&(S.fcat==='All'||t.cat==S.fcat)&&(!S.q||(t.no+t.client+t.dev).toLowerCase().includes(S.q.toLowerCase())));
 const cats=isAdmin()?S.cats:S.cats.filter(c=>S.user.cats.includes(c.id));
 return `<div class="head"><h1>Service tickets</h1></div>
 <div class="stats">${['Open','In Progress','Approved','Rejected'].map(s=>`<div class="card stat ${S.fstat===s?'on':''}" onclick="S.fstat=S.fstat==='${s}'?'All':'${s}';render()"><span class="mute">${s}</span><b>${cnt(s)}</b></div>`).join('')}</div>
 <div class="tools"><input placeholder="Search ticket no., client or device" value="${esc(S.q)}" oninput="S.q=this.value;render();const i=document.querySelector('.tools input');i.focus();i.setSelectionRange(99,99)" aria-label="Search">
 <select aria-label="Category" onchange="S.fcat=this.value;render()"><option value="All">All categories</option>${cats.map(c=>`<option value="${c.id}" ${S.fcat==c.id?'selected':''}>${esc(c.name)}</option>`).join('')}</select></div>
 <div class="card tw">${rows.length?`<table><thead><tr><th>Ticket</th><th>Category</th><th>Client</th><th>Device</th><th>Raised</th><th>Status</th></tr></thead><tbody>${rows.map(t=>`<tr class="row" tabindex="0" onclick="S.sel='${t.no}';render()" onkeydown="if(event.key==='Enter'){S.sel='${t.no}';render()}"><td><b>${t.no}</b></td><td>${esc(catName(t.cat))}</td><td>${esc(t.client)}</td><td>${esc(t.dev)}</td><td class="mute">${t.on}</td><td><span class="pill ${t.st.replace(' ','')}">${t.st}</span></td></tr>`).join('')}</tbody></table>`:'<div class="empty">No tickets match these filters.</div>'}</div>`}

function detailV(){
 const t=S.tickets.find(x=>x.no===S.sel),done=t.st==='Approved'||t.st==='Rejected';
 return `<div class="head"><button class="btn" onclick="S.sel=null;render()">← Back to tickets</button><h1>${t.no}</h1><span class="pill ${t.st.replace(' ','')}">${t.st}</span></div>
 <div class="grid2"><div class="card pad"><h2>${esc(catName(t.cat))}</h2>
 <div class="kv"><span>Client</span><span>${esc(t.client)}</span><span>Device</span><span>${esc(t.dev)}</span><span>Document</span><span>${esc(t.doc)}</span><span>Raised</span><span>${t.on}</span></div>
 <h3>Client's request</h3><p>${esc(t.desc)}</p>
 ${done?'':`<label for="rm">Remarks (required to reject)</label><textarea id="rm" rows="3" placeholder="Visible to the client"></textarea><div class="err" id="err"></div>
 <div class="acts">${t.st==='Open'?'<button class="btn" onclick="act(\'prog\')">Mark in progress</button>':''}<button class="btn bad" onclick="act('rej')">Reject</button><button class="btn ok" onclick="act('ok')">Approve &amp; enable re-upload</button></div>`}</div>
 <div class="card pad"><h2>Activity</h2><ul class="log">${t.log.map(l=>`<li>${esc(l[0])}<div class="mute small">${l[1]}</div></li>`).join('')}</ul></div></div>`}
function act(k){
 const t=S.tickets.find(x=>x.no===S.sel),r=($('#rm')||{}).value||'',who=S.user.name;
 if(k==='rej'&&!r.trim()){$('#err').textContent='Add remarks so the client knows why.';return}
 if(k==='prog'){t.st='In Progress';t.log.push(['Marked In Progress by '+who,now()])}
 if(k==='ok'){t.st='Approved';t.log.push(['Approved by '+who+' – Re-upload enabled'+(r?' ('+r+')':''),now()]);toast('Approved. Client notified, re-upload enabled.')}
 if(k==='rej'){t.st='Rejected';t.log.push(['Rejected by '+who+' – '+r,now()]);toast('Rejected. Client notified.')}
 render()}

function teamV(){
 return `<div class="head"><h1>Support team</h1><span class="sp"></span><button class="btn p" onclick="S.modal={t:'add'};render()">Add member</button></div>
 <div class="card tw" style="overflow:visible"><table><thead><tr><th>Name</th><th>Email</th><th>Mobile</th><th>Categories</th><th>Last login</th><th>Status</th><th></th></tr></thead><tbody>
 ${S.members.map(m=>`<tr><td><b>${esc(m.name)}</b></td><td>${esc(m.email)}</td><td>${esc(m.mobile)}</td><td>${m.cats.map(c=>esc(catName(c))).join(', ')||'<span class="mute">None</span>'}</td><td class="mute">${m.last}</td><td><span class="pill ${m.active?'Active':'Inactive'}">${m.active?'Active':'Inactive'}</span></td>
 <td><div class="menu"><button class="btn" aria-label="Actions" onclick="S.menu=S.menu===${m.id}?null:${m.id};render()">Actions ▾</button>${S.menu===m.id?`<div class="mlist"><button onclick="regen(${m.id})">Regenerate password</button><button onclick="S.modal={t:'edit',id:${m.id}};S.menu=null;render()">Edit details</button><button onclick="toggleM(${m.id})">${m.active?'Deactivate':'Activate'}</button></div>`:''}</div></td></tr>`).join('')}</tbody></table></div>`}
function regen(id){const m=S.members.find(x=>x.id===id);m.pw=pw();m.must=true;S.menu=null;S.modal={t:'mail',m,why:'Password regenerated. Existing sessions are signed out.'};render()}
function toggleM(id){const m=S.members.find(x=>x.id===id);m.active=!m.active;S.menu=null;toast(m.name+(m.active?' activated':' deactivated'));render()}

function catsV(){
 return `<div class="head"><h1>Service categories</h1><span class="sp"></span><button class="btn p" onclick="S.modal={t:'cat'};render()">Add category</button></div>
 <p class="mute">Clients pick one of these when they raise a ticket. Only active categories appear in the WebPortal.</p>
 <div class="card tw"><table><thead><tr><th>Category</th><th>Tickets</th><th>Support members</th><th>Status</th><th></th></tr></thead><tbody>
 ${S.cats.map(c=>`<tr><td><b>${esc(c.name)}</b></td><td>${S.tickets.filter(t=>t.cat===c.id).length}</td><td>${S.members.filter(m=>m.cats.includes(c.id)).length}</td><td><span class="pill ${c.active?'Active':'Inactive'}">${c.active?'Active':'Inactive'}</span></td>
 <td><button class="btn" onclick="S.modal={t:'cat',id:${c.id}};render()">Rename</button> <button class="btn" onclick="tc(${c.id})">${c.active?'Disable':'Enable'}</button></td></tr>`).join('')}</tbody></table></div>`}
function tc(id){const c=S.cats.find(x=>x.id===id);c.active=!c.active;render()}

function modalV(){
 const m=S.modal;let h='';
 if(m.t==='add'||m.t==='edit'){const e=m.t==='edit'?S.members.find(x=>x.id===m.id):{name:'',email:'',mobile:'',cats:[]};
  h=`<h2>${m.t==='add'?'Add support member':'Edit member'}</h2>
  <label for="mn">Full name</label><input id="mn" value="${esc(e.name)}"><label for="me">Email</label><input id="me" type="email" value="${esc(e.email)}" ${m.t==='edit'?'disabled':''}><label for="mm">Mobile</label><input id="mm" value="${esc(e.mobile)}">
  <label>Service categories</label>${S.cats.filter(c=>c.active).map(c=>`<label class="chk"><input type="checkbox" class="cc" value="${c.id}" ${e.cats.includes(c.id)?'checked':''}> ${esc(c.name)}</label>`).join('')}
  <div class="err" id="err"></div>${m.t==='add'?'<div class="small mute">A temporary password is generated and emailed to the member.</div>':''}
  <div class="acts"><button class="btn" onclick="S.modal=null;render()">Cancel</button><button class="btn p" onclick="saveM('${m.t}',${m.id||0})">${m.t==='add'?'Create and email credentials':'Save changes'}</button></div>`}
 if(m.t==='cat'){const c=m.id?S.cats.find(x=>x.id===m.id):{name:''};
  h=`<h2>${m.id?'Rename category':'Add service category'}</h2><label for="cn">Category name</label><input id="cn" value="${esc(c.name)}" placeholder="e.g. Device Document Updation Request"><div class="err" id="err"></div>
  <div class="acts"><button class="btn" onclick="S.modal=null;render()">Cancel</button><button class="btn p" onclick="saveC(${m.id||0})">Save category</button></div>`}
 if(m.t==='mail'){h=`<h2>Email sent</h2><p class="mute">${m.why}</p><div class="mail">To: ${esc(m.m.email)}
Subject: Your Support Desk login

Hello ${esc(m.m.name)},
Login: Support Desk (WebPortal)
Username: ${esc(m.m.email)}
Temporary password: ${esc(m.m.pw)}

You will be asked to set a new password after you sign in.</div><div class="small mute" style="margin-top:8px">Shown here for the prototype only. The real password goes only by email.</div><div class="acts"><button class="btn p" onclick="S.modal=null;render()">Done</button></div>`}
 return `<div class="modal" onclick="if(event.target===this){S.modal=null;render()}"><div class="card" role="dialog" aria-modal="true">${h}</div></div>`}
function saveM(t,id){
 const n=$('#mn').value.trim(),e=($('#me').value||'').trim().toLowerCase(),mo=$('#mm').value.trim(),cs=[...document.querySelectorAll('.cc:checked')].map(x=>+x.value);
 if(!n||!e||!mo){$('#err').textContent='Full name, email and mobile are required.';return}
 if(!/^\S+@\S+\.\S+$/.test(e)){$('#err').textContent='Enter a valid email address.';return}
 if(!/^\d{10}$/.test(mo)){$('#err').textContent='Enter a 10-digit mobile number.';return}
 if(t==='add'){if(S.members.some(x=>x.email===e)){$('#err').textContent='A member with this email already exists.';return}
  const m={id:Date.now(),name:n,email:e,mobile:mo,pw:pw(),active:true,must:true,last:'Never',cats:cs};S.members.push(m);S.modal={t:'mail',m,why:'Member created. Credentials were emailed.'}}
 else{const m=S.members.find(x=>x.id===id);m.name=n;m.mobile=mo;m.cats=cs;S.modal=null;toast('Member updated')}
 render()}
function saveC(id){const n=$('#cn').value.trim();if(!n){$('#err').textContent='Enter a category name.';return}
 if(S.cats.some(c=>c.name.toLowerCase()===n.toLowerCase()&&c.id!==id)){$('#err').textContent='This category already exists.';return}
 if(id)S.cats.find(c=>c.id===id).name=n;else S.cats.push({id:Date.now(),name:n,active:true});S.modal=null;render()}
render();
</script>
