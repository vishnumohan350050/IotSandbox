:root{

.brand .tline{font-size:15px;font-weight:600;color:var(--navy);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand .sub{font-size:11px;color:var(--sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pill{font-size:11px;padding:3px 10px;border-radius:99px;background:var(--accent-bg);color:var(--navy);font-weight:600;border:1px solid var(--line);white-space:nowrap}
header button.ghost{color:var(--sub);border-color:var(--line)}
.wrap{max-width:1000px;margin:0 auto;padding:16px;padding-bottom:calc(24px + env(safe-area-inset-bottom,0px))}
footer{border-top:1px solid var(--line);margin-top:8px;padding:16px 18px calc(16px + env(safe-area-inset-bottom,0px));text-align:center;color:var(--sub);font-size:11.5px}
footer b{color:var(--text)}
.tabs{display:flex;gap:6px;margin-bottom:16px;flex-wrap:wrap}
.tab{padding:7px 13px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--sub);font-size:13px;cursor:pointer;font-weight:600}
.tab.active{background:var(--navy);color:#fff;border-color:var(--navy)}
.card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:16px;box-shadow:0 1px 3px rgba(0,87,194,.06)}
.card h2{font-size:14px;margin:0 0 12px}
table{width:100%;border-collapse:collapse;font-size:13px}
th{background:#f5f9ff;text-align:left;color:var(--sub);font-weight:600;font-size:11px;text-transform:uppercase;letter-spacing:.03em;padding:6px 8px;border-bottom:1px solid var(--line)}
td{padding:9px 8px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:none}
.tblwrap{overflow-x:auto}
.badge{font-size:11px;padding:2px 9px;border-radius:99px;font-weight:600;white-space:nowrap}
.b-active,.b-approved{background:var(--accent-bg);color:var(--accent)}
.b-inactive,.b-rejected{background:var(--red-bg);color:var(--red)}
.b-open{background:var(--purple-bg);color:var(--purple)}
.b-progress{background:var(--amber-bg);color:var(--amber)}
button{font:inherit;cursor:pointer;border-radius:7px;border:1px solid var(--line);background:var(--card);color:var(--text);padding:6px 11px;font-weight:600}
button.primary{background:var(--navy);color:#fff;border-color:var(--navy)}
button.primary:hover:not(:disabled){background:var(--navy2)}
button.danger{background:var(--red);color:#fff;border-color:var(--red)}
button.ghost{border-color:transparent;background:transparent;padding:4px 6px}
button:disabled{opacity:.4;cursor:default}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
input,select,textarea{font:inherit;padding:7px 9px;border-radius:7px;border:1px solid var(--line);background:var(--bg);color:var(--text);width:100%}
textarea{min-height:64px;resize:vertical}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
label{font-size:12px;color:var(--sub);font-weight:600;display:block;margin-bottom:4px}
.field{margin-bottom:10px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:16px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;text-align:center;cursor:pointer}
.stat.on{border-color:var(--cyan);box-shadow:0 0 0 2px var(--accent-bg)}
.stat b{display:block;font-size:22px}
.stat span{font-size:11px;color:var(--sub)}
.link{color:var(--accent);cursor:pointer;font-weight:600;text-decoration:none}
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.4);display:none;align-items:center;justify-content:center;z-index:20;padding:16px}
.modal-bg.show{display:flex}
.modal{background:var(--card);border-radius:12px;padding:18px;width:100%;max-width:420px;border:1px solid var(--line)}
.modal h3{margin:0 0 12px;font-size:15px}
.toast{position:fixed;bottom:calc(18px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--text);color:var(--bg);padding:9px 16px;border-radius:8px;font-size:13px;opacity:0;transition:opacity .25s;z-index:30;pointer-events:none}
.toast.show{opacity:1}
.log{border-left:2px solid var(--line);padding-left:12px;margin-left:4px}
.log-item{margin-bottom:12px;position:relative}
.log-item:before{content:"";position:absolute;left:-17px;top:3px;width:8px;height:8px;border-radius:50%;background:var(--accent)}
.log-item .meta{font-size:11px;color:var(--sub)}
.muted{color:var(--sub);font-size:12px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{font-size:11px;background:var(--purple-bg);color:var(--purple);padding:3px 8px;border-radius:99px}
.backbtn{margin-bottom:12px}
.empty{color:var(--sub);text-align:center;padding:24px;font-size:13px}

.tabs{overflow-x:auto;flex-wrap:nowrap;-webkit-overflow-scrolling:touch}
.tab{white-space:nowrap;flex-shrink:0}
@media (max-width:900px){.wrap{padding:12px}}
@media (max-width:640px){
  header{flex-wrap:wrap;gap:8px 10px;padding-left:12px;padding-right:12px}
  .brand{flex:1 1 60%}
  .brand .tline{font-size:13.5px}
  .logo-mark{width:38px;height:38px}
  header .pill{order:3}
  header #switchRoleBtn{order:4;margin-left:auto}
  .stats{grid-template-columns:repeat(2,1fr)}
  .grid2{grid-template-columns:1fr}
  .card{padding:12px}
  .row input,.row select{max-width:none!important;flex:1 1 100%}
  .row.hdr,.card > .row:first-child{gap:8px}
  table{font-size:12.5px;min-width:560px}
  .modal{max-width:100%}
  button{padding:8px 12px}
}

.tracker{display:flex;gap:10px;margin-top:8px}
.step{flex:1;border:1px solid var(--line);border-radius:10px;padding:10px;display:flex;flex-direction:column;gap:2px;background:#fff}
.step .dot{width:22px;height:22px;border-radius:50%;background:#e8eef8;color:var(--sub);display:grid;place-items:center;font-size:12px;font-weight:700;margin-bottom:4px}
.step.done{border-color:var(--navy);background:#f5f9ff}.step.done .dot{background:var(--navy);color:#fff}
.step.bad{border-color:var(--red);background:#fff5f5}.step.bad .dot{background:var(--red)}
.step small{color:var(--sub);font-size:11.5px;line-height:1.35}
@media (max-width:640px){.tracker{flex-direction:column}}
</style>
</head>

  const c = {Open:0,'In Progress':0,Approved:0,Rejected:0};
  list.forEach(t=>c[t.status]++);
  return `<div class="stats">${['Open','In Progress','Approved','Rejected'].map(x=>`<div class="stat ${current===x?'on':''}" data-statfilter="${x}"><b>${c[x]}</b><span>${x}</span></div>`).join('')}</div>`;
}
function progressTracker(t){
  const got = a => t.log.find(l=>l.action===a);
  const raised = got('Ticket Raised'), prog = got('Marked In Progress'), fin = got('Approved')||got('Rejected');
  const rej = t.status==='Rejected';
  const steps = [
    {n:'Raised', d:raised, on:true},
    {n:'In Progress', d:prog, on:!!prog, skipped:!prog && !!fin},
    {n:fin?fin.action:'Approved / Rejected', d:fin, on:!!fin, bad:rej}
  ];
  return `<div class="tracker">${steps.map((p,i)=>`<div class="step ${p.on?'done':''} ${p.bad?'bad':''} ${p.skipped?'skip':''}"><span class="dot">${p.on?(p.bad?'✕':'✓'):i+1}</span><b>${p.n}</b><small>${p.d?p.d.actor+'<br>'+p.d.at:(p.skipped?'Skipped (direct resolution)':'Pending')}</small></div>`).join('')}</div>`;
}

// ---------- Super Admin ----------
function adminView(){
  if(openTicketId) return ticketDetailScreen(openTicketId, true);
  return `
  <div class="tabs">
    <button class="tab ${adminTab==='categories'?'active':''}" data-tab="categories">Service Categories</button>
    <button class="tab ${adminTab==='team'?'active':''}" data-tab="team">Support Service Team</button>
    <button class="tab ${adminTab==='tickets'?'active':''}" data-tab="tickets">All Tickets</button>
  </div>
  ${adminTab==='categories'?categoriesPanel():adminTab==='team'?teamPanel():allTicketsPanel()}
  `;
}

function categoriesPanel(){
  const rows = categories.map(c=>{
    const tCount = tickets.filter(t=>t.categoryId===c.id).length;
    const mCount = members.filter(m=>m.categoryIds.includes(c.id)).length;
    return `<tr>
      <td><b>${c.name}</b></td>
      <td>${tCount}</td><td>${mCount}</td>
      <td><span class="badge ${badgeCls(c.status)}">${c.status}</span></td>
      <td class="row">
        <button class="ghost" data-rename="${c.id}">Rename</button>
        <button class="ghost" data-togglecat="${c.id}">${c.status==='Active'?'Disable':'Enable'}</button>
      </td></tr>`;
  }).join('');
  return `
  <div class="card">
    <div class="row" style="justify-content:space-between;margin-bottom:12px">
      <h2 style="margin:0">Service Categories</h2>
      <button class="primary" id="addCatBtn">+ Add Category</button>
    </div>
    <div class="tblwrap"><table><thead><tr><th>Category</th><th>Tickets</th><th>Members</th><th>Status</th><th></th></tr></thead>
    <tbody>${rows}</tbody></table></div>
    <p class="muted" style="margin-top:10px">Categories are configuration only — adding one here makes it selectable for member assignment and new tickets immediately, no other screen changes.</p>
  </div>`;
}

function teamPanel(){
  const rows = members.map(m=>`<tr>
    <td><b>${m.name}</b><div class="muted">${m.email}</div></td>
    <td>${m.mobile}</td>
    <td><div class="chips">${m.categoryIds.map(id=>`<span class="chip">${catName(id)}</span>`).join('')||'<span class="muted">none</span>'}</div></td>
    <td><span class="badge ${badgeCls(m.status)}">${m.status}</span></td>
    <td class="muted">${m.lastLogin}</td>
    <td class="row">
      <button class="ghost" data-editmember="${m.id}">Edit</button>
      <button class="ghost" data-regen="${m.id}">Regenerate pwd</button>
      <button class="ghost" data-togglemember="${m.id}">${m.status==='Active'?'Deactivate':'Activate'}</button>
    </td></tr>`).join('');
  return `
  <div class="card">
    <div class="row" style="justify-content:space-between;margin-bottom:12px">
      <h2 style="margin:0">Support Service Team</h2>
      <button class="primary" id="addMemberBtn">+ Add Support Member</button>
    </div>
    <div class="tblwrap"><table><thead><tr><th>Name / Email</th><th>Mobile</th><th>Categories</th><th>Status</th><th>Last login</th><th></th></tr></thead>
    <tbody>${rows}</tbody></table></div>
  </div>`;
}

function allTicketsPanel(){
  let list = tickets;
  const base = tickets;
  if(adminStatusFilter) list = list.filter(t=>t.status===adminStatusFilter);
  if(adminCatFilter) list = list.filter(t=>t.categoryId===adminCatFilter);
  if(adminSearch.trim()){ const q=adminSearch.trim().toLowerCase(); list = list.filter(t=>t.ticketNo.toLowerCase().includes(q)||t.client.toLowerCase().includes(q)||t.device.toLowerCase().includes(q)); }
  return statCards(base, adminStatusFilter) + `<div class="card"><h2>All Tickets</h2>
    <div class="row" style="margin-bottom:12px">
      <input style="max-width:220px" placeholder="Search ticket/client/device" id="adminSearchInput" value="${adminSearch}">
      <select id="adminCatSelect" style="max-width:240px"><option value="">All categories</option>${categories.map(c=>`<option value="${c.id}" ${adminCatFilter===c.id?'selected':''}>${c.name}</option>`).join('')}</select>
      ${adminStatusFilter?`<button class="ghost" id="clearStatFilter">Clear status: ${adminStatusFilter} ✕</button>`:''}
    </div>${ticketTable(list, true)}</div>`;
}

function ticketTable(list, showCategory){
  if(!list.length) return `<div class="empty">No tickets to show.</div>`;
  const rows = list.map(t=>`<tr>
    <td><a class="link" data-openticket="${t.id}">${t.ticketNo}</a></td>
    ${showCategory?`<td>${catName(t.categoryId)}</td>`:''}
    <td>${t.client}</td><td>${t.device}</td>
    <td class="muted">${t.raisedOn}</td>
    <td><span class="badge ${badgeCls(t.status)}">${t.status}</span></td>
    <td class="muted">${handledBy(t)}</td>
  </tr>`).join('');
  return `<div class="tblwrap"><table><thead><tr><th>Ticket No.</th>${showCategory?'<th>Category</th>':''}<th>Client</th><th>Device</th><th>Raised On</th><th>Status</th><th>Handled by</th></tr></thead>
  <tbody>${rows}</tbody></table></div>`;
}

// ---------- Support Member ----------
function memberView(){
  if(!loggedInMemberId) return memberLoginScreen();
  if(openTicketId) return ticketDetailScreen(openTicketId, true);
  const mine = members.find(m=>m.id===loggedInMemberId);
  const myTickets = tickets.filter(t=>mine.categoryIds.includes(t.categoryId));
  const counts = {Open:0,'In Progress':0,Approved:0,Rejected:0};
  myTickets.forEach(t=>counts[t.status]++);
  let list = myTickets;
  if(memberStatusFilter) list = list.filter(t=>t.status===memberStatusFilter);
  if(memberCatFilter) list = list.filter(t=>t.categoryId===memberCatFilter);
  if(memberSearch.trim()){
    const q=memberSearch.trim().toLowerCase();
    list = list.filter(t=>t.ticketNo.toLowerCase().includes(q)||t.client.toLowerCase().includes(q)||t.device.toLowerCase().includes(q));
  }
  const myCats = categories.filter(c=>mine.categoryIds.includes(c.id));
  return `
  <div class="stats">
    ${['Open','In Progress','Approved','Rejected'].map(s=>`
      <div class="stat ${memberStatusFilter===s?'on':''}" data-statfilter="${s}"><b>${counts[s]}</b><span>${s}</span></div>
    `).join('')}
  </div>
  <div class="card">
    <div class="row" style="margin-bottom:12px">
      <input style="max-width:220px" placeholder="Search ticket/client/device" id="memberSearchInput" value="${memberSearch}">
      <select id="memberCatSelect" style="max-width:220px">
        <option value="">All my categories</option>
        ${myCats.map(c=>`<option value="${c.id}" ${memberCatFilter===c.id?'selected':''}>${c.name}</option>`).join('')}
      </select>
      ${memberStatusFilter?`<button class="ghost" id="clearStatFilter">Clear status: ${memberStatusFilter} ✕</button>`:''}
    </div>
    ${ticketTable(list, true)}
  </div>`;
}

function memberLoginScreen(){
  const opts = members.map(m=>`<option value="${m.id}">${m.name} (${m.email})</option>`).join('');
  return `
  <div class="card" style="max-width:380px;margin:40px auto">
    <h2>Support Member Login</h2>
    <p class="muted">Mock login — pick a member to sign in as, to see category-restricted access.</p>
    <div class="field"><label>Support Member</label><select id="loginSelect">${opts}</select></div>
    <div class="field"><label>Password</label><input type="password" value="••••••••" disabled></div>
    <button class="primary" id="doLoginBtn" style="width:100%">Log in</button>
    <p class="muted" style="margin-top:10px"><a class="link">Forgot password?</a> · <a class="link">Set/change password</a> screens are UI states only in this phase.</p>
  </div>`;
}

function ticketDetailScreen(id, isMember){
  const t = tickets.find(x=>x.id===id);
  const canAct = t.status==='Open' || t.status==='In Progress';
  return `
  <button class="ghost backbtn" id="backBtn">← Back</button>
  <div class="card">
    <div class="row" style="justify-content:space-between">
      <h2 style="margin:0">${t.ticketNo} <span class="badge ${badgeCls(t.status)}" style="font-family:var(--sans)">${t.status}</span></h2>
      ${isMember?`<div class="row">
        <button ${t.status!=='Open'?'disabled':''} id="btnProgress">Mark In Progress</button>
        <button class="primary" ${!canAct?'disabled':''} id="btnApprove">Approve</button>
        <button class="danger" ${!canAct?'disabled':''} id="btnReject">Reject</button>
      </div>`:''}
    </div>
    <div class="grid2" style="margin:14px 0">
      <div><label>Category</label><div>${catName(t.categoryId)}</div></div>
      <div><label>Document Category</label><div>${t.docCategory||'—'}</div></div>
      <div><label>Client</label><div>${t.client}</div></div>
      <div><label>Device</label><div>${t.device}</div></div>
      <div><label>Raised On</label><div>${t.raisedOn}</div></div>
      <div><label>Resolved At</label><div>${t.resolvedAt||'—'}</div></div>
    </div>
    <div class="field"><label>Description / Request</label><div>${t.description}</div></div>
    <div class="field"><label>Handled by</label><div>${handledBy(t)}</div></div>
    <label>Progress</label>${progressTracker(t)}
    ${t.remarks?`<div class="field"><label>Remarks</label><div>${t.remarks}</div></div>`:''}
  </div>
  <div class="card">
    <h2>Activity Log</h2>
    <div class="log">${t.log.map(l=>`<div class="log-item"><b>${l.action}</b><div class="meta">${l.actor} · ${l.at}</div>${l.remarks?`<div class="muted">${l.remarks}</div>`:''}</div>`).join('')}</div>
  </div>`;
}

// ---------- Actions ----------
function addLog(t, action, actor, remarks){ t.log.push({action, actor, remarks:remarks||null, at:new Date().toISOString().slice(0,16).replace('T',' ')}); }

function wireEvents(){
  app.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{adminTab=b.dataset.tab; openTicketId=null; render();});
  app.querySelectorAll('[data-openticket]').forEach(b=>b.onclick=()=>{openTicketId=b.dataset.openticket; render();});
  const back = $('#backBtn'); if(back) back.onclick=()=>{openTicketId=null; render();};

  // categories
  const addCat = $('#addCatBtn'); if(addCat) addCat.onclick=()=>{
    showModal(`<h3>Add Service Category</h3>
      <div class="field"><label>Category Name</label><input id="mCatName" placeholder="e.g. Firmware Update Request"></div>
      <div class="row" style="justify-content:flex-end"><button class="ghost" id="mCancel">Cancel</button><button class="primary" id="mSave">Save</button></div>`);
    $('#mCancel').onclick=closeModal;
    $('#mSave').onclick=()=>{
      const v=$('#mCatName').value.trim(); if(!v) return;
      categories.push({id:'c'+Date.now(), name:v, status:'Active'});
      closeModal(); toast('Category added'); render();
    };
  };
  app.querySelectorAll('[data-togglecat]').forEach(b=>b.onclick=()=>{
    const c = categories.find(x=>x.id===b.dataset.togglecat);
    c.status = c.status==='Active'?'Inactive':'Active';
    toast(`${c.name} ${c.status==='Active'?'enabled':'disabled'}`); render();
  });
  app.querySelectorAll('[data-rename]').forEach(b=>b.onclick=()=>{
    const c = categories.find(x=>x.id===b.dataset.rename);
    showModal(`<h3>Rename Category</h3>
      <div class="field"><label>Category Name</label><input id="mCatName2" value="${c.name}"></div>
      <div class="row" style="justify-content:flex-end"><button class="ghost" id="mCancel">Cancel</button><button class="primary" id="mSave">Save</button></div>`);
    $('#mCancel').onclick=closeModal;
    $('#mSave').onclick=()=>{ c.name=$('#mCatName2').value.trim()||c.name; closeModal(); toast('Category renamed'); render(); };
  });

  // team
  const addMem = $('#addMemberBtn'); if(addMem) addMem.onclick=()=>{
    const catOpts = categories.filter(c=>c.status==='Active').map(c=>`<label style="display:inline-flex;gap:5px;align-items:center;margin:3px 10px 3px 0;font-weight:400"><input type="checkbox" value="${c.id}"> ${c.name}</label>`).join('');
    showModal(`<h3>Add Support Member</h3>
      <div class="field"><label>Full Name</label><input id="mName"></div>
      <div class="field"><label>Email</label><input id="mEmail" type="email"></div>
      <div class="field"><label>Mobile</label><input id="mMobile"></div>
      <div class="field"><label>Assigned Service Categories</label>${catOpts}</div>
      <div class="row" style="justify-content:flex-end"><button class="ghost" id="mCancel">Cancel</button><button class="primary" id="mSave">Save</button></div>`);
    $('#mCancel').onclick=closeModal;
    $('#mSave').onclick=()=>{
      const name=$('#mName').value.trim(), email=$('#mEmail').value.trim(), mobile=$('#mMobile').value.trim();
      const cats=[...document.querySelectorAll('#modalBox input[type=checkbox]:checked')].map(c=>c.value);
      if(!name||!email||!mobile||!cats.length) return toast('Fill all fields and pick at least one category');
      members.push({id:'m'+Date.now(), name, email, mobile, categoryIds:cats, status:'Active', lastLogin:'—'});
      closeModal(); toast('Support Member added, credentials email sent (mock)'); render();
    };
  };
  app.querySelectorAll('[data-togglemember]').forEach(b=>b.onclick=()=>{
    const m = members.find(x=>x.id===b.dataset.togglemember);
    m.status = m.status==='Active'?'Inactive':'Active';
    toast(`${m.name} ${m.status==='Active'?'activated':'deactivated'}`); render();
  });
  app.querySelectorAll('[data-regen]').forEach(b=>b.onclick=()=>{
    const m = members.find(x=>x.id===b.dataset.regen);
    toast(`New temporary password emailed to ${m.email} (mock)`);
  });
  app.querySelectorAll('[data-editmember]').forEach(b=>b.onclick=()=>{
    const m = members.find(x=>x.id===b.dataset.editmember);
    const catOpts = categories.filter(c=>c.status==='Active'||m.categoryIds.includes(c.id)).map(c=>`<label style="display:inline-flex;gap:5px;align-items:center;margin:3px 10px 3px 0;font-weight:400"><input type="checkbox" value="${c.id}" ${m.categoryIds.includes(c.id)?'checked':''}> ${c.name}</label>`).join('');
    showModal(`<h3>Edit Support Member</h3>
      <div class="field"><label>Full Name</label><input id="mName" value="${m.name}"></div>
      <div class="field"><label>Mobile</label><input id="mMobile" value="${m.mobile}"></div>
      <div class="field"><label>Assigned Service Categories</label>${catOpts}</div>
      <div class="row" style="justify-content:flex-end"><button class="ghost" id="mCancel">Cancel</button><button class="primary" id="mSave">Save</button></div>`);
    $('#mCancel').onclick=closeModal;
    $('#mSave').onclick=()=>{
      m.name=$('#mName').value.trim()||m.name; m.mobile=$('#mMobile').value.trim()||m.mobile;
      m.categoryIds=[...document.querySelectorAll('#modalBox input[type=checkbox]:checked')].map(c=>c.value);
      closeModal(); toast('Support Member updated'); render();
    };
  });

  // member login
  const loginBtn = $('#doLoginBtn'); if(loginBtn) loginBtn.onclick=()=>{
    loggedInMemberId = $('#loginSelect').value; render();
  };

  // dashboard filters
  const statTiles = app.querySelectorAll('[data-statfilter]');
  statTiles.forEach(s=>s.onclick=()=>{
    const v=s.dataset.statfilter; if(role==='admin'){adminStatusFilter = adminStatusFilter===v?null:v;} else {memberStatusFilter = memberStatusFilter===v?null:v;} render();
  });
  const clearStat = $('#clearStatFilter'); if(clearStat) clearStat.onclick=()=>{memberStatusFilter=null; adminStatusFilter=null; render();};
  const aS = $('#adminSearchInput'); if(aS) aS.oninput=()=>{adminSearch=aS.value; render(); const x=$('#adminSearchInput'); x.focus(); x.setSelectionRange(x.value.length,x.value.length);};
  const aC = $('#adminCatSelect'); if(aC) aC.onchange=()=>{adminCatFilter=aC.value; render();};
  const searchIn = $('#memberSearchInput'); if(searchIn) searchIn.oninput=()=>{memberSearch=searchIn.value; render(); searchIn.focus(); searchIn.setSelectionRange(searchIn.value.length,searchIn.value.length);};
  const catSel = $('#memberCatSelect'); if(catSel) catSel.onchange=()=>{memberCatFilter=catSel.value; render();};

  // ticket actions
  const bp=$('#btnProgress'); if(bp) bp.onclick=()=>{
    const t=tickets.find(x=>x.id===openTicketId); t.status='In Progress'; addLog(t,'Marked In Progress',actorName()); toast('Ticket marked In Progress'); render();
  };
  const ba=$('#btnApprove'); if(ba) ba.onclick=()=>{
    const t=tickets.find(x=>x.id===openTicketId); t.status='Approved'; t.resolvedAt=new Date().toISOString().slice(0,16).replace('T',' ');
    const note = t.docCategory ? `Re-upload enabled for ${t.docCategory}` : 'Approval action completed';
    addLog(t,'Approved',actorName(),note); toast('Ticket approved, client notified'); render();
  };
  const br=$('#btnReject'); if(br) br.onclick=()=>{
    showModal(`<h3>Reject Ticket</h3>
      <div class="field"><label>Remarks (mandatory)</label><textarea id="mRemarks" placeholder="Reason for rejection"></textarea></div>
      <div class="row" style="justify-content:flex-end"><button class="ghost" id="mCancel">Cancel</button><button class="danger" id="mSave">Reject</button></div>`);
    $('#mCancel').onclick=closeModal;
    $('#mSave').onclick=()=>{
      const r=$('#mRemarks').value.trim(); if(!r) return toast('Remarks are mandatory');
      const t=tickets.find(x=>x.id===openTicketId); t.status='Rejected'; t.remarks=r; t.resolvedAt=new Date().toISOString().slice(0,16).replace('T',' ');
      addLog(t,'Rejected',actorName(),r); closeModal(); toast('Ticket rejected, client notified'); render();
    };
  };
}

render();
</script>
